
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merry Gift 聖誕禮物舖</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Microsoft JhengHei", sans-serif;
  background: #fffaf2;
  color: #42564b;
  overflow-x: hidden;
}

header {
  background: #b83b4b;
  color: white;
  text-align: center;
  padding: 25px 15px;
}

header h1 {
  margin: 0;
  font-size: 36px;
}

header p {
  margin-bottom: 0;
}

nav {
  background: #e8f2e7;
  padding: 15px;
  display: flex;
  justify-content: center;
  gap: 25px;
  align-items: center;
  flex-wrap: wrap;
}

nav a {
  color: #42644e;
  text-decoration: none;
  font-weight: bold;
}

.cart-button {
  border: none;
  border-radius: 25px;
  padding: 11px 18px;
  background: #b83b4b;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

.hero {
  text-align: center;
  padding: 45px 15px;
  background: linear-gradient(135deg, #fce7e5, #e4f3e6);
}

.hero h2 {
  font-size: 30px;
  margin: 0 0 12px;
}

.hero p {
  line-height: 1.8;
}

.hero button {
  background: #426d50;
  color: white;
  border: none;
  padding: 13px 25px;
  border-radius: 25px;
  font-size: 16px;
  cursor: pointer;
}

.products {
  max-width: 1100px;
  margin: auto;
  padding: 35px 20px;
}

.section-title {
  text-align: center;
  margin-bottom: 25px;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 20px;
}

.product {
  background: white;
  border-radius: 20px;
  padding: 18px;
  text-align: center;
  box-shadow: 0 5px 18px #8a78621c;
  transition: transform 0.3s, box-shadow 0.3s;
}

.product:hover {
  transform: translateY(-7px);
  box-shadow: 0 12px 25px #8a786235;
}

.product-picture {
  height: 130px;
  display: grid;
  place-items: center;
  background: #f7eee4;
  border-radius: 16px;
  font-size: 75px;
}

.product h3 {
  margin-bottom: 8px;
}

.price {
  color: #bd4552;
  font-size: 20px;
  font-weight: bold;
}

.add-button {
  width: 100%;
  background: #477b58;
  color: white;
  border: none;
  border-radius: 25px;
  padding: 12px;
  cursor: pointer;
  font-size: 15px;
  transition: background 0.2s, transform 0.2s;
}

.add-button:hover {
  background: #315c40;
}

.add-button:active {
  transform: scale(0.92);
}

/* 購物車區域 */
.cart-section {
  max-width: 800px;
  margin: 10px auto 50px;
  padding: 25px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 5px 18px #8a78621c;
}

.cart-section h2 {
  text-align: center;
}

.cart-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px dashed #ddd;
}

.cart-emoji {
  font-size: 30px;
}

.cart-info {
  flex: 1;
}

.cart-info small {
  display: block;
  margin-top: 5px;
  color: #8a8a8a;
}

.quantity-button {
  border: none;
  background: #e8f2e7;
  border-radius: 50%;
  width: 28px;
  height: 28px;
  cursor: pointer;
}

.remove-button {
  border: none;
  background: transparent;
  color: #b83b4b;
  cursor: pointer;
}

.cart-total {
  text-align: right;
  font-size: 22px;
  font-weight: bold;
  color: #b83b4b;
  margin-top: 20px;
}

.checkout-button {
  width: 100%;
  border: none;
  border-radius: 25px;
  padding: 14px;
  margin-top: 15px;
  background: #b83b4b;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

.empty {
  text-align: center;
  color: #999;
  padding: 20px;
}

footer {
  text-align: center;
  padding: 25px;
  background: #42644e;
  color: white;
}

/* 飄雪動畫 */
.snowflake {
  position: fixed;
  top: -30px;
  z-index: 10;
  pointer-events: none;
  animation: snowfall linear forwards;
}

@keyframes snowfall {
  to {
    transform: translateY(110vh) rotate(360deg);
    opacity: 0.25;
  }
}

/* 加入購物車的可愛粒子 */
.particle {
  position: fixed;
  z-index: 100;
  pointer-events: none;
  font-size: 25px;
  animation: pop 0.9s ease-out forwards;
}

@keyframes pop {
  0% {
    opacity: 1;
    transform: translate(0, 0) scale(0.5) rotate(0);
  }
  100% {
    opacity: 0;
    transform: translate(var(--x), var(--y))
      scale(1.5) rotate(160deg);
  }
}

/* 購物車彈跳 */
.cart-bounce {
  animation: bounce 0.45s ease;
}

@keyframes bounce {
  0%, 100% { transform: scale(1); }
  35% { transform: scale(1.25) rotate(-5deg); }
  65% { transform: scale(0.95) rotate(5deg); }
}

/* 加入成功提示 */
.toast {
  position: fixed;
  left: 50%;
  bottom: 35px;
  transform: translate(-50%, 25px);
  background: #42644e;
  color: white;
  padding: 14px 22px;
  border-radius: 30px;
  opacity: 0;
  pointer-events: none;
  z-index: 200;
  transition: 0.3s;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (max-width: 850px) {
  .product-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 450px) {
  .product-grid {
    grid-template-columns: 1fr;
  }

  header h1 {
    font-size: 28px;
  }

  .cart-section {
    margin: 10px;
    padding: 16px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎄 Merry Gift 🎄</h1>
  <p>✨ 把聖誕節的幸福送給最重要的人 ✨</p>
</header>

<nav>
  <a href="#home">首頁</a>
  <a href="#products">聖誕商品</a>
  <a href="#cart">我的購物車</a>
  <button class="cart-button" id="navCart"
    onclick="goToCart()">
    🛒 購物車 (<span id="cartCount">0</span>)
  </button>
</nav>

<section class="hero" id="home">
  <h2>🎅 聖誕驚喜，準備送達！</h2>
  <p>
    ❄️ 雪花正在飄落，聖誕禮物也準備好了！<br>
    挑選一份可愛的小禮物，讓今年的聖誕節更加溫暖。
  </p>
  <button onclick="goToProducts()">🎁 開始挑選禮物</button>
</section>

<section class="products" id="products">
  <h2 class="section-title">🎁 聖誕限定商品</h2>

  <div class="product-grid" id="productGrid"></div>
</section>

<section class="cart-section" id="cart">
  <h2>🛒 我的聖誕購物車</h2>
  <div id="cartItems">
    <div class="empty">購物車還空空的，快來挑選禮物吧！ 🎁</div>
  </div>
  <div class="cart-total">
    總金額：NT$ <span id="total">0</span>
  </div>
  <button class="checkout-button" onclick="checkout()">
    🎄 前往結帳
  </button>
</section>

<footer>
  <p>🎄 Merry Gift 聖誕禮物舖 🎄</p>
  <p>Made with ❤️ and Christmas Magic</p>
</footer>

<div class="toast" id="toast">
  🎁 成功加入購物車！
</div>

<script>
// 商品資料
const products = [
  { id: 1, name: "聖誕老人玩偶", emoji: "🎅",
    price: 299, desc: "陪你過冬的可愛夥伴" },
  { id: 2, name: "薑餅人吊飾", emoji: "🍪",
    price: 129, desc: "甜甜的聖誕小驚喜" },
  { id: 3, name: "雪人娃娃", emoji: "☃️",
    price: 199, desc: "冬日限定的萌萌雪人" },
  { id: 4, name: "聖誕驚喜禮盒", emoji: "🎁",
    price: 399, desc: "把滿滿心意送給你" }
];

// 購物車資料
let cart = [];
let toastTimer;

const productGrid = document.getElementById("productGrid");

// 顯示商品
function renderProducts() {
  productGrid.innerHTML = products.map(product => `
    <article class="product">
      <div class="product-picture">${product.emoji}</div>
      <h3>${product.name}</h3>
      <p>${product.desc}</p>
      <p class="price">NT$ ${product.price}</p>
      <button class="add-button"
        onclick="addToCart(${product.id}, this)">
        🎁 加入購物車
      </button>
    </article>
  `).join("");
}

// 加入購物車
function addToCart(id, button) {
  const product = products.find(item => item.id === id);
  const existing = cart.find(item => item.id === id);

  if (existing) {
    existing.quantity++;
  } else {
    cart.push({ ...product, quantity: 1 });
  }

  renderCart();
  createMagic(button);
  showToast(`🎁 ${product.name} 已放進購物車！`);

  // 購物車按鈕彈跳
  const navCart = document.getElementById("navCart");
  navCart.classList.remove("cart-bounce");
  void navCart.offsetWidth;
  navCart.classList.add("cart-bounce");

  // 按鈕短暫變化
  button.textContent = "✨ 加入成功！";
  setTimeout(() => {
    button.textContent = "🎁 加入購物車";
  }, 800);
}

// 更新購物車內容
function renderCart() {
  const cartItems = document.getElementById("cartItems");
  const totalElement = document.getElementById("total");

  const count = cart.reduce(
    (sum, item) => sum + item.quantity, 0
  );

  const total = cart.reduce(
    (sum, item) => sum + item.price * item.quantity, 0
  );

  document.getElementById("cartCount").textContent = count;
  totalElement.textContent = total;

  if (cart.length === 0) {
    cartItems.innerHTML =
      '<div class="empty">購物車還空空的，快來挑選禮物吧！ 🎁</div>';
    return;
  }

  cartItems.innerHTML = cart.map(item => `
    <div class="cart-item">
      <span class="cart-emoji">${item.emoji}</span>
      <div class="cart-info">
        <strong>${item.name}</strong>
        <small>NT$ ${item.price} × ${item.quantity}</small>
      </div>
      <button class="quantity-button"
        onclick="changeQuantity(${item.id}, -1)"
        aria-label="減少數量">−</button>
      <span>${item.quantity}</span>
      <button class="quantity-button"
        onclick="changeQuantity(${item.id}, 1)"
        aria-label="增加數量">+</button>
      <button class="remove-button"
        onclick="removeItem(${item.id})">移除</button>
    </div>
  `).join("");
}

// 增加或減少商品數量
function changeQuantity(id, amount) {
  const item = cart.find(item => item.id === id);
  if (!item) return;

  item.quantity += amount;

  if (item.quantity <= 0) {
    cart = cart.filter(item => item.id !== id);
  }

  renderCart();
}

// 移除商品
function removeItem(id) {
  cart = cart.filter(item => item.id !== id);
  renderCart();
  showToast("商品已從購物車移除 🛒");
}

// 加入商品時的粒子特效
function createMagic(button) {
  const rect = button.getBoundingClientRect();
  const emojis = ["❤️", "✨", "🎄", "❄️", "⭐", "🎁"];

  for (let i = 0; i < 12; i++) {
    const particle = document.createElement("span");
    particle.className = "particle";
    particle.textContent =
      emojis[Math.floor(Math.random() * emojis.length)];

    particle.style.left = (rect.left + rect.width / 2) + "px";
    particle.style.top = (rect.top + rect.height / 2) + "px";
    particle.style.setProperty("--x",
      (Math.random() * 200 - 100) + "px");
    particle.style.setProperty("--y",
      (Math.random() * -180 - 20) + "px");

    document.body.appendChild(particle);

    particle.addEventListener("animationend", () => {
      particle.remove();
    });
  }
}

// 顯示提示訊息
function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 1800);
}

// 持續飄雪
function createSnowflake() {
  const snow = document.createElement("span");
  snow.className = "snowflake";

  const snowTypes = ["❄", "❅", "✧", "❆"];
  snow.textContent =
    snowTypes[Math.floor(Math.random() * snowTypes.length)];

  snow.style.left = Math.random() * 100 + "vw";
  snow.style.fontSize = (12 + Math.random() * 18) + "px";
  snow.style.opacity = 0.4 + Math.random() * 0.6;

  const duration = 5 + Math.random() * 7;
  snow.style.animationDuration = duration + "s";

  document.body.appendChild(snow);

  setTimeout(() => snow.remove(), duration * 1000);
}

// 導覽功能
function goToProducts() {
  document.getElementById("products").scrollIntoView({
    behavior: "smooth"
  });
}

function goToCart() {
  document.getElementById("cart").scrollIntoView({
    behavior: "smooth"
  });
}

// 模擬結帳
function checkout() {
  if (cart.length === 0) {
    showToast("🎁 購物車是空的喔！");
    return;
  }

  const total = cart.reduce(
    (sum, item) => sum + item.price * item.quantity, 0
  );

  alert(
    "🎄 感謝光臨 Merry Gift！\n\n" +
    "商品總金額：NT$ " + total +
    "\n這是課堂作業展示版，尚未串接真實付款。"
  );
}

// 啟動網站
renderProducts();
renderCart();
setInterval(createSnowflake, 250);
</script>

</body>
</html>
